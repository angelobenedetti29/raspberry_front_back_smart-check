[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "models",
    "data",
    ".venv",
    "venv",
    "build",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(
    \.venv
  | venv
  | build
  | dist
  | models
  | data
  | \.pytest_cache
  | \.ruff_cache
)/
'''
