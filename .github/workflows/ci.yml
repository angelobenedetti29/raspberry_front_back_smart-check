name: CI

on:
  push:
    branches: [main, "rework/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias de la app
        # La Pi trae cv2/hailo del sistema, pero los tests importan
        # backend.streaming/pipeline/capture, que importan cv2 a nivel de
        # módulo; hailo_platform sigue siendo lazy. Instalamos cv2 sólo acá.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install opencv-python-headless

      - name: Lint (ruff)
        run: |
          pip install ruff==0.17.1
          ruff check .

      - name: Formato (black)
        run: |
          pip install black==26.10.1
          black --check .

      - name: Tests
        # Import-time check: si `backend.*` no carga, pytest ni arranca.
        run: |
          pip install pytest
          pytest -v